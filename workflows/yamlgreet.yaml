document:
  dsl: '1.0.0'
  namespace: examples
  name: yamlgreet
  version: '1.0.0'
input:
  schema:
    format: json
    document:
      type: object
      properties:
        language:
          title: Language
          description: Language to greet
          type: string
          enum:
            - English
            - Spanish
          default: English
        name:
          title: Name
          description: Name of the person
          type: string
          default: John
          pattern: '^[a-zA-Z0-9]([-a-z0-9]*[a-zA-Z0-9])?$'
      required:
        - name
do:
  - chooseGreeting:
      switch:
        - spanish:
            when: .language == "Spanish"
            then: setSpanishGreeting
        - default:
            then: setEnglishGreeting
  - setSpanishGreeting:
      set:
        name: ${ .name }
        greeting: 'Saludos desde YAML Workflow, '
      then: buildGreeting
  - setEnglishGreeting:
      set:
        name: ${ .name }
        greeting: 'Hello from YAML Workflow, '
      then: buildGreeting
  - buildGreeting:
      set:
        message: '${ .greeting + .name }'
